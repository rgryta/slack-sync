# The whole service: both binaries and every SQL statement.
#
# The root package carries only the MCP binary, and depends on `slack-core` and
# `slack-mcp` but never on `slack-client`. That is a link-time guarantee rather than a
# tested one: the process that serves the archive cannot reach Slack, because the code
# to do so is not in it. `tests/archive/isolation.rs` keeps the manifests honest.
[workspace]
members = ["crates/core", "crates/ingest", "crates/mcp", "crates/slack"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
# The toolchain the image builds with, which is always the latest stable. Cargo resolves
# dependencies to what this claims, so an older number holds back releases (at 1.85 it held
# back security fixes) and promises support for compilers nothing tests.
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
slack-client = { path = "crates/slack" }
slack-core = { path = "crates/core" }
slack-mcp = { path = "crates/mcp" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "chrono",
    "json",
    "macros",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal"] }
tracing = "0.1.44"

[package]
name = "slack-sync"
description = "Read-only MCP server over the Slack archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "slack-mcp"
path = "src/bin/slack-mcp.rs"

[dependencies]
slack-core.workspace = true
slack-mcp.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8.9"
chrono.workspace = true
# Dev-dependencies only: the loops are tested here so one container serves the whole
# suite, and a dev edge does not reach the `slack-mcp` binary target. `slack-client` is
# here for the fake Slack's payload parsing and nothing else.
slack-client.workspace = true
slack-ingest = { path = "crates/ingest" }
serde_json.workspace = true
sqlx.workspace = true
# The Rust mirror of `tests/conftest.py`: a postgres:18-alpine whose DSN the container
# builds itself, so no test can be pointed at a real database.
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
# `reusable-containers` is what lets one named container serve every run. Rust never
# drops a `static`, so a container parked in one would otherwise be left behind with
# nothing to reap it; reuse makes that explicit and bounded to a single container.
testcontainers = { version = "0.27.3", features = ["reusable-containers"] }

[[test]]
name = "archive"
path = "tests/archive/main.rs"

[profile.release]
# The pilot exists to measure resident memory, and these are the two knobs that move
# it: one codegen unit lets the linker drop more, and aborting on panic removes the
# unwinding tables.
lto = true
codegen-units = 1
panic = "abort"
strip = true
